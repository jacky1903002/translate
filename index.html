<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalTranslate Hub - 企業級多國語言翻譯平台</title>
  
  <!-- PWA Manifest 支援手機安裝 -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22GlobalTranslate%20Hub%22%2C%22short_name%22%3A%22Translate%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%5D%7D">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #06b6d4;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #475569;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08), 0 8px 10px -6px rgba(79, 70, 229, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* 容器預設為寬螢幕網頁版，當套用 mobile-mode 時會模擬手機窄螢幕框 */
    .card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 1000px;
      transition: max-width 0.3s ease, padding 0.3s ease;
    }

    /* 手機模擬模式尺寸 */
    .card.mobile-mode {
      max-width: 400px !important;
      padding: 24px !important;
      border-radius: 36px;
      border: 8px solid #1e293b;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    /* 頂部檢視模式切換列 */
    .view-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      color: var(--text);
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 15px;
      margin-bottom: 30px;
      font-weight: 400;
    }

    #auth-screen {
      max-width: 420px;
      margin: 0 auto;
      text-align: left;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 8px;
    }

    input[type="email"], input[type="password"], input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      background: #ffffff;
      color: var(--text);
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-main:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    #app-screen {
      display: none;
    }

    .app-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .user-welcome {
      font-weight: 700;
      color: var(--primary);
      font-size: 16px;
    }

    .translator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    /* 當外層切換為手機模擬模式時，翻譯區塊強制改為單欄上下排列 */
    .card.mobile-mode .translator-grid {
      grid-template-columns: 1fr !important;
    }

    @media (max-width: 768px) {
      .translator-grid {
        grid-template-columns: 1fr;
      }
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    textarea, .result-box {
      height: 160px;
      resize: vertical;
    }

    .result-box {
      background: #f8fafc;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .btn-sub {
      background: #f1f5f9;
      color: var(--text-light);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sub:hover {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-sub.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .history-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
    }

    .history-list {
      max-height: 150px;
      overflow-y: auto;
      font-size: 13px;
      color: var(--text-light);
      background: #fdfdfd;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .history-item {
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
    }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8OBnssy09OEnw-_zKjNTniC-cQwdRqes",
      authDomain: "translate-199fc.firebaseapp.com",
      databaseURL: "https://translate-199fc-default-rtdb.firebaseio.com",
      projectId: "translate-199fc",
      storageBucket: "translate-199fc.firebasestorage.app",
      messagingSenderId: "702026261922",
      appId: "1:702026261922:web:e363edc4daaa80749b7efb",
      measurementId: "G-KKSJTE3K86"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.signOut = signOut;
    window.ref = ref;
    window.set = set;
    window.push = push;
    window.onValue = onValue;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        const nickname = localStorage.getItem('user_nickname') || user.email.split('@')[0];
        document.getElementById('welcome-msg').innerText = `歡迎回來，${nickname} 🏢`;
        loadTranslationHistory(user.uid);
      } else {
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('app-screen').style.display = 'none';
      }
    });
  </script>
</head>
<body>

  <!-- 主卡片容器 -->
  <div class="card" id="main-card">
    <!-- 畫面檢視模式切換列 (網頁版 / 手機版切換) -->
    <div class="view-switcher">
      <button class="btn-sub active" id="btn-desktop-view" onclick="switchView('desktop')">💻 網頁版檢視</button>
      <button class="btn-sub" id="btn-mobile-view" onclick="switchView('mobile')">📱 手機版檢視</button>
    </div>

    <!-- ================= 登入 / 註冊畫面 ================= -->
    <div id="auth-screen">
      <h2>🚀 GlobalTranslate 企業平台</h2>
      <p class="subtitle">請先完成帳號登入或快速註冊以使用商業翻譯服務。</p>
      
      <div class="form-group">
        <label for="nickname-input">使用者暱稱</label>
        <input type="text" id="nickname-input" placeholder="請輸入您的稱呼 (例: Alex)">
      </div>

      <div class="form-group">
        <label for="email-input">電子郵件帳號</label>
        <input type="email" id="email-input" placeholder="name@company.com">
      </div>

      <div class="form-group">
        <label for="password-input">密碼 (至少 6 碼)</label>
        <input type="password" id="password-input" placeholder="••••••••">
      </div>

      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button class="btn-main" onclick="handleAuth('register')">立即註冊</button>
        <button class="btn-main" style="background: #334155;" onclick="handleAuth('login')">登入系統</button>
      </div>
    </div>

    <!-- ================= 主翻譯操作介面 ================= -->
    <div id="app-screen">
      <div class="app-header-bar">
        <div id="welcome-msg" class="user-welcome">歡迎回來</div>
        <button class="btn-sub" onclick="handleLogout()">登出系統</button>
      </div>

      <h2>🌐 企業級多國語言翻譯中樞</h2>
      <p class="subtitle">支援中、英、日、越高效互譯，翻譯數據將自動同步至 Firebase 雲端資料庫。</p>

      <div class="translator-grid">
        <!-- 來源輸入 -->
        <div>
          <div class="pane-header">
            <label>來源語言</label>
            <select id="source-lang">
              <option value="autodetect">自動偵測語言</option>
              <option value="zh-TW">繁體中文</option>
              <option value="en">英文 (English)</option>
              <option value="ja">日文 (日本語)</option>
              <option value="vi">越南文 (Tiếng Việt)</option>
            </select>
          </div>
          <textarea id="source-text" placeholder="請在此輸入要翻譯的業務文件或段落..."></textarea>
          <div class="actions-bar">
            <span style="font-size: 12px; color: var(--text-light);" id="char-count">0 字元</span>
            <button class="btn-sub" onclick="document.getElementById('source-text').value='';">清空</button>
          </div>
        </div>

        <!-- 結果輸出 -->
        <div>
          <div class="pane-header">
            <label>目標語言</label>
            <select id="target-lang">
              <option value="zh-TW">繁體中文</option>
              <option value="en" selected>英文 (English)</option>
              <option value="ja">日文 (日本語)</option>
              <option value="vi">越南文 (Tiếng Việt)</option>
            </select>
          </div>
          <div id="result" class="result-box">等待翻譯內容輸入...</div>
          <div class="actions-bar">
            <span style="font-size: 12px; color: var(--text-light);" id="status-label">就緒</span>
            <button class="btn-sub" onclick="copyResult()">複製結果</button>
          </div>
        </div>
      </div>

      <button class="btn-main" onclick="translateText()">執行專業翻譯並同步雲端</button>

      <!-- 雲端紀錄同步區 -->
      <div class="history-section">
        <label style="margin-bottom: 8px;">📊 Firebase 即時雲端翻譯紀錄</label>
        <div id="history-list" class="history-list">正在載入歷史資料...</div>
      </div>
    </div>
  </div>

  <script>
    // 切換網頁版 / 手機版模擬畫面
    function switchView(mode) {
      const card = document.getElementById('main-card');
      const btnDesktop = document.getElementById('btn-desktop-view');
      const btnMobile = document.getElementById('btn-mobile-view');

      if (mode === 'mobile') {
        card.classList.add('mobile-mode');
        btnMobile.classList.add('active');
        btnDesktop.classList.remove('active');
      } else {
        card.classList.remove('mobile-mode');
        btnDesktop.classList.add('active');
        btnMobile.classList.remove('active');
      }
    }

    async function handleAuth(action) {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const nickname = document.getElementById('nickname-input').value.trim();

      if (!email || !password) {
        alert('請完整填寫電子郵件與密碼！');
        return;
      }
      if (action === 'register' && !nickname) {
        alert('註冊時請輸入您的暱稱！');
        return;
      }
      if (nickname) {
        localStorage.setItem('user_nickname', nickname);
      }

      try {
        if (action === 'register') {
          await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
          alert('註冊成功並已自動登入！');
        } else {
          await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
        }
      } catch (error) {
        alert('操作失敗： ' + error.message);
      }
    }

    function handleLogout() {
      window.signOut(window.firebaseAuth).then(() => {
        localStorage.removeItem('user_nickname');
      });
    }

    async function translateText() {
      const text = document.getElementById('source-text').value.trim();
      const sourceLang = document.getElementById('source-lang').value;
      const targetLang = document.getElementById('target-lang').value;
      const resultDiv = document.getElementById('result');
      const statusLabel = document.getElementById('status-label');

      if (!text) {
        alert('請輸入要翻譯的文字內容！');
        return;
      }

      resultDiv.innerText = '翻譯進行中...';
      statusLabel.innerText = '處理中';

      const langpair = `${sourceLang}|${targetLang}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data && data.responseStatus === 200 && data.responseData) {
          const translated = data.responseData.translatedText;
          resultDiv.innerText = translated;
          statusLabel.innerText = '翻譯完成';

          const user = window.firebaseAuth.currentUser;
          if (user) {
            const historyRef = window.ref(window.firebaseDb, 'translations/' + user.uid);
            const newEntryRef = window.push(historyRef);
            await window.set(newEntryRef, {
              source: text,
              target: translated,
              langpair: langpair,
              timestamp: new Date().toISOString()
            });
          }
        } else {
          resultDiv.innerText = '翻譯失敗，請稍後再試。';
          statusLabel.innerText = '錯誤';
        }
      } catch (error) {
        resultDiv.innerText = '網路連線異常：' + error.message;
        statusLabel.innerText = '失敗';
      }
    }

    function loadTranslationHistory(uid) {
      const historyRef = window.ref(window.firebaseDb, 'translations/' + uid);
      window.onValue(historyRef, (snapshot) => {
        const listContainer = document.getElementById('history-list');
        listContainer.innerHTML = '';
        
        const data = snapshot.val();
        if (!data) {
          listContainer.innerHTML = '<div class="history-item">尚無翻譯紀錄</div>';
          return;
        }

        const items = Object.values(data).reverse();
        items.slice(0, 5).forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.innerHTML = `<strong>[${item.langpair}]</strong> ${escapeHtml(item.source)} ➔ <span style="color:var(--primary);">${escapeHtml(item.target)}</span>`;
          listContainer.appendChild(div);
        });
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyResult() {
      const text = document.getElementById('result').innerText;
      if (!text || text.includes('等待')) {
        alert('沒有可複製的翻譯結果！');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('已成功複製到剪貼簿！');
      });
    }
  </script>
</body>
</html>
