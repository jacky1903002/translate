<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalTranslate Hub - 企業級多國語言翻譯平台</title>
  
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22GlobalTranslate%20Hub%22%2C%22short_name%22%3A%22Translate%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%5D%7D">
  <meta name="theme-color" content="#4f46e5">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #06b6d4;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #475569;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08), 0 8px 10px -6px rgba(79, 70, 229, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 1100px;
      transition: all 0.3s ease;
    }

    .card.mobile-mode {
      max-width: 400px !important;
      padding: 16px !important;
      border-radius: 32px;
      border: 8px solid #1e293b;
    }

    .card.floating-card-mode {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.25), 0 0 20px rgba(6, 182, 212, 0.15);
      border: 2px solid var(--accent);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .top-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .toolbar-inline {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .view-switcher {
      display: flex;
      gap: 6px;
    }

    #auth-screen {
      max-width: 420px;
      margin: 20px auto;
      text-align: left;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 6px;
    }

    input[type="email"], input[type="password"], input[type="text"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      background: #ffffff;
      color: var(--text);
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-main:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    #app-screen {
      display: none;
    }

    .app-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--text-light);
    }

    .user-welcome {
      font-weight: 700;
      color: var(--primary);
    }

    .translator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 12px;
    }

    .card.mobile-mode .translator-grid {
      grid-template-columns: 1fr !important;
    }

    @media (max-width: 768px) {
      .translator-grid {
        grid-template-columns: 1fr;
      }
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    textarea, .result-box {
      height: 320px !important;
      resize: vertical;
      font-size: 15px;
      line-height: 1.5;
    }

    .result-box {
      background: #f8fafc;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .btn-sub {
      background: #f1f5f9;
      color: var(--text-light);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-sub:hover {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-sub.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 錄音中特效按鈕 */
    .btn-sub.recording {
      background: #ef4444 !important;
      color: #fff !important;
      border-color: #dc2626 !important;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .history-section {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .history-list {
      max-height: 72px;
      overflow-y: auto;
      font-size: 12px;
      color: var(--text-light);
      background: #fdfdfd;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }

    .history-item {
      padding: 3px 0;
      border-bottom: 1px solid #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8OBnssy09OEnw-_zKjNTniC-cQwdRqes",
      authDomain: "translate-199fc.firebaseapp.com",
      databaseURL: "https://translate-199fc-default-rtdb.firebaseio.com",
      projectId: "translate-199fc",
      storageBucket: "translate-199fc.firebasestorage.app",
      messagingSenderId: "702026261922",
      appId: "1:702026261922:web:e363edc4daaa80749b7efb",
      measurementId: "G-KKSJTE3K86"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.signOut = signOut;
    window.ref = ref;
    window.set = set;
    window.push = push;
    window.onValue = onValue;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        const nickname = localStorage.getItem('user_nickname') || user.email.split('@')[0];
        document.getElementById('welcome-msg').innerText = `歡迎回來，${nickname} 🏢`;
        loadTranslationHistory(user.uid);
      } else {
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('app-screen').style.display = 'none';
      }
    });
  </script>
</head>
<body>

  <div class="card" id="main-card">
    <div class="top-header-row">
      <div class="header-left">
        <h2>🌐 企業級多國語言翻譯中樞</h2>
      </div>
      <div class="toolbar-inline">
        <button class="btn-sub" onclick="downloadExcelTemplate()">📥 下載範本</button>
        <label class="btn-sub" style="margin-bottom: 0; cursor: pointer; background: #e0e7ff; color: #3730a3; border-color: #c7d2fe;">
          📂 匯入 <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelImport(event)">
        </label>
        <button class="btn-sub" onclick="exportCurrentToExcel()">📤 匯出結果</button>
        <div class="view-switcher" style="margin-left: 6px;">
          <button class="btn-sub active" id="btn-desktop-view" onclick="switchView('desktop')">💻 網頁</button>
          <button class="btn-sub" id="btn-mobile-view" onclick="switchView('mobile')">📱 手機</button>
          <button class="btn-sub" id="btn-floating-mode" onclick="toggleFloatingMode()">✨ 浮動</button>
        </div>
      </div>
    </div>

    <!-- 登入畫面 -->
    <div id="auth-screen">
      <p style="color: var(--text-light); font-size: 14px; margin-top: 0;">請先完成帳號登入或快速註冊以使用商業翻譯與 Excel 批次處理服務。</p>
      
      <div class="form-group">
        <label for="nickname-input">使用者暱稱</label>
        <input type="text" id="nickname-input" placeholder="請輸入您的稱呼 (例: Alex)">
      </div>

      <div class="form-group">
        <label for="email-input">電子郵件帳號</label>
        <input type="email" id="email-input" placeholder="name@company.com">
      </div>

      <div class="form-group">
        <label for="password-input">密碼 (至少 6 碼)</label>
        <input type="password" id="password-input" placeholder="••••••••">
      </div>

      <div style="display: flex; gap: 12px; margin-top: 20px;">
        <button class="btn-main" onclick="handleAuth('register')">立即註冊</button>
        <button class="btn-main" style="background: #334155;" onclick="handleAuth('login')">登入系統</button>
      </div>
    </div>

    <!-- 主翻譯介面 -->
    <div id="app-screen">
      <div class="app-header-bar">
        <div id="welcome-msg" class="user-welcome">歡迎回來</div>
        <button class="btn-sub" onclick="handleLogout()" style="padding: 2px 8px;">登出系統</button>
      </div>

      <div class="translator-grid">
        <!-- 來源輸入 -->
        <div>
          <div class="pane-header">
            <div style="display: flex; align-items: center; gap: 6px;">
              <label>來源語言</label>
              <button class="btn-sub" style="padding: 1px 5px; font-size: 10px;" onclick="speakText('source-text', 'source-lang')" title="語音朗讀">🔊 朗讀</button>
              <!-- 新增語音辨識按鈕 -->
              <button class="btn-sub" id="btn-mic" style="padding: 1px 5px; font-size: 10px;" onclick="toggleSpeechRecognition()" title="語音輸入">🎤 語音</button>
            </div>
            <select id="source-lang" onchange="triggerTranslate()">
              <option value="autodetect">自動偵測語言</option>
              <option value="zh-TW">繁體中文</option>
              <option value="en">英文 (English)</option>
              <option value="ja">日文 (日本語)</option>
              <option value="vi">越南文 (Tiếng Việt)</option>
            </select>
          </div>
          <textarea id="source-text" placeholder="請在此輸入或點擊語音按鈕說話，系統將自動即時翻譯..." oninput="handleSourceInput()"></textarea>
          <div class="actions-bar">
            <span style="font-size: 11px; color: var(--text-light);" id="char-count">0 字元</span>
            <button class="btn-sub" onclick="clearText()">清空</button>
          </div>
        </div>

        <!-- 結果輸出 -->
        <div>
          <div class="pane-header">
            <div style="display: flex; align-items: center; gap: 6px;">
              <label>目標語言</label>
              <button class="btn-sub" style="padding: 1px 5px; font-size: 10px;" onclick="speakText('result', 'target-lang')" title="語音朗讀">🔊 朗讀</button>
            </div>
            <select id="target-lang" onchange="triggerTranslate()">
              <option value="zh-TW" selected>繁體中文</option>
              <option value="en">英文 (English)</option>
              <option value="ja">日文 (日本語)</option>
              <option value="vi">越南文 (Tiếng Việt)</option>
            </select>
          </div>
          <div id="result" class="result-box">即時翻譯結果將顯示於此...</div>
          <div class="actions-bar">
            <span style="font-size: 11px; color: var(--text-light);" id="status-label">就緒</span>
            <button class="btn-sub" onclick="copyResult()">複製結果</button>
          </div>
        </div>
      </div>

      <!-- 雲端紀錄 -->
      <div class="history-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label style="margin-bottom: 0; font-size: 12px;">📊 即時雲端翻譯紀錄</label>
          <button class="btn-sub" style="background: #ecfdf5; color: #065f46; border-color: #a7f3d0; padding: 2px 6px; font-size: 10px;" onclick="exportHistoryToExcel()">📥 匯出歷史 Excel</button>
        </div>
        <div id="history-list" class="history-list">正在載入歷史資料...</div>
      </div>
    </div>
  </div>

  <script>
    let translateTimer = null;
    let cloudSaveTimer = null;
    let currentHistoryData = {};
    let activeController = null;
    let recognition = null;
    let isRecording = false;

    // 初始化瀏覽器語音辨識 (SpeechRecognition API)
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return null;
      }
      const rec = new SpeechRecognition();
      rec.continuous = false; // 單次短語或連續語音
      rec.interimResults = true; // 顯示即時辨識中文字

      const sourceLang = document.getElementById('source-lang').value;
      rec.lang = (sourceLang !== 'autodetect') ? sourceLang : 'zh-TW';

      rec.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('source-text').value = transcript;
        handleSourceInput(); // 自動觸發即時同步翻譯
      };

      rec.onerror = (event) => {
        console.error('語音辨識錯誤:', event.error);
        stopSpeechRecognition();
      };

      rec.onend = () => {
        stopSpeechRecognition();
      };

      return rec;
    }

    function toggleSpeechRecognition() {
      const btnMic = document.getElementById('btn-mic');
      if (!isRecording) {
        recognition = initSpeechRecognition();
        if (!recognition) {
          alert('您的瀏覽器不支援語音辨識功能（建議使用 Chrome 或 Edge 瀏覽器）。');
          return;
        }
        try {
          recognition.start();
          isRecording = true;
          btnMic.classList.add('recording');
          btnMic.innerText = '⏹ 停止';
          document.getElementById('status-label').innerText = '正在聆聽語音...';
        } catch (e) {
          console.error(e);
        }
      } else {
        stopSpeechRecognition();
      }
    }

    function stopSpeechRecognition() {
      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }
      isRecording = false;
      const btnMic = document.getElementById('btn-mic');
      btnMic.classList.remove('recording');
      btnMic.innerText = '🎤 語音';
      document.getElementById('status-label').innerText = '就緒';
    }

    function switchView(mode) {
      const card = document.getElementById('main-card');
      const btnDesktop = document.getElementById('btn-desktop-view');
      const btnMobile = document.getElementById('btn-mobile-view');
      if (mode === 'mobile') {
        card.classList.add('mobile-mode');
        btnMobile.classList.add('active');
        btnDesktop.classList.remove('active');
      } else {
        card.classList.remove('mobile-mode');
        btnDesktop.classList.add('active');
        btnMobile.classList.remove('active');
      }
    }

    function toggleFloatingMode() {
      const card = document.getElementById('main-card');
      const btnFloating = document.getElementById('btn-floating-mode');
      card.classList.toggle('floating-card-mode');
      if (card.classList.contains('floating-card-mode')) {
        btnFloating.style.background = 'var(--primary)';
        btnFloating.style.color = '#fff';
      } else {
        btnFloating.style.background = '';
        btnFloating.style.color = '';
      }
    }

    function speakText(elementId, langSelectId) {
      let text = "";
      if (elementId === 'source-text') {
        text = document.getElementById('source-text').value.trim();
      } else {
        text = document.getElementById('result').innerText.trim();
      }

      if (!text || text.includes('即時翻譯結果')) {
        alert('沒有可朗讀的文字內容！');
        return;
      }
      if (!('speechSynthesis' in window)) {
        alert('您的瀏覽器不支援語音朗讀！');
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const langVal = document.getElementById(langSelectId).value;
      
      if (langVal && langVal !== 'autodetect') {
        utterance.lang = langVal;
      } else {
        utterance.lang = 'zh-TW';
      }

      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function handleSourceInput() {
      const text = document.getElementById('source-text').value;
      document.getElementById('char-count').innerText = `${text.length} 字元`;

      clearTimeout(translateTimer);
      if (!text.trim()) {
        document.getElementById('result').innerText = '即時翻譯結果將顯示於此...';
        document.getElementById('status-label').innerText = '就緒';
        return;
      }

      document.getElementById('status-label').innerText = '極速同步中...';
      translateTimer = setTimeout(() => {
        performTranslate(false);
      }, 250);
    }

    function triggerTranslate() {
      const text = document.getElementById('source-text').value.trim();
      if (text) performTranslate(true);
    }

    function clearText() {
      document.getElementById('source-text').value = '';
      document.getElementById('result').innerText = '即時翻譯結果將顯示於此...';
      document.getElementById('status-label').innerText = '就緒';
      document.getElementById('char-count').innerText = '0 字元';
    }

    async function performTranslate(isManual) {
      const text = document.getElementById('source-text').value.trim();
      const sourceLang = document.getElementById('source-lang').value;
      const targetLang = document.getElementById('target-lang').value;
      const resultDiv = document.getElementById('result');
      const statusLabel = document.getElementById('status-label');

      if (!text) return;

      if (activeController) {
        activeController.abort();
      }
      activeController = new AbortController();

      const langpair = `${sourceLang}|${targetLang}`;

      try {
        const chunks = splitTextIntoChunks(text, 500);
        
        const promises = chunks.map(async (chunk) => {
          const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=${langpair}`;
          const response = await fetch(url, { signal: activeController.signal });
          const data = await response.json();
          if (data && data.responseStatus === 200 && data.responseData) {
            return data.responseData.translatedText;
          }
          return chunk;
        });

        const translatedChunks = await Promise.all(promises);
        const finalResult = translatedChunks.join("\n").trim();
        
        resultDiv.innerText = finalResult;
        statusLabel.innerText = '同步完成';

        clearTimeout(cloudSaveTimer);
        cloudSaveTimer = setTimeout(() => {
          saveToCloud(text, finalResult, langpair);
        }, 1000);

      } catch (error) {
        if (error.name === 'AbortError') return;
        if (isManual) alert('網路連線異常： ' + error.message);
        statusLabel.innerText = '連線失敗';
      }
    }

    function splitTextIntoChunks(str, maxLen) {
      const regex = new RegExp(`.{1,${maxLen}}`, 'g');
      return str.match(regex) || [str];
    }

    async function saveToCloud(source, target, langpair) {
      const user = window.firebaseAuth.currentUser;
      if (user) {
        const historyRef = window.ref(window.firebaseDb, 'translations/' + user.uid);
        const newEntryRef = window.push(historyRef);
        await window.set(newEntryRef, {
          source: source,
          target: target,
          langpair: langpair,
          timestamp: new Date().toISOString()
        });
      }
    }

    function loadTranslationHistory(uid) {
      const historyRef = window.ref(window.firebaseDb, 'translations/' + uid);
      window.onValue(historyRef, (snapshot) => {
        const listContainer = document.getElementById('history-list');
        listContainer.innerHTML = '';
        
        const data = snapshot.val();
        currentHistoryData = data || {};

        if (!data) {
          listContainer.innerHTML = '<div class="history-item">尚無翻譯紀錄</div>';
          return;
        }

        const items = Object.values(data).reverse();
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.innerHTML = `<strong>[${item.langpair}]</strong> ${escapeHtml(item.source.substring(0, 30))}... ➔ <span style="color:var(--primary);">${escapeHtml(item.target.substring(0, 30))}...</span>`;
          listContainer.appendChild(div);
        });
      });
    }

    function downloadExcelTemplate() {
      const templateData = [
        { "來源單字或例句": "Hello, welcome to our company.", "說明": "請在左欄填入您要批次翻譯的文字" },
        { "來源單字或例句": "Precision manufacturing process", "說明": "支援單字、片語或長篇例句" }
      ];
      const worksheet = XLSX.utils.json_to_sheet(templateData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "翻譯範本");
      XLSX.writeFile(workbook, "Translate_Template.xlsx");
    }

    async function handleExcelImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const json = XLSX.utils.sheet_to_json(worksheet);

          if (json.length === 0) {
            alert('Excel 檔案內沒有找到資料！');
            return;
          }

          const keyName = Object.keys(json[0])[0];
          let batchResults = [];
          const targetLang = document.getElementById('target-lang').value;

          document.getElementById('status-label').innerText = '批次翻譯中...';

          for (let row of json) {
            const text = row[keyName];
            if (text) {
              const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|${targetLang}`;
              try {
                const res = await fetch(url);
                const jsonRes = await res.json();
                const translated = (jsonRes && jsonRes.responseData) ? jsonRes.responseData.translatedText : "翻譯失敗";
                batchResults.push({
                  "原始單字/例句": text,
                  "目標語言": targetLang,
                  "對應翻譯": translated,
                  "時間": new Date().toLocaleString()
                });
              } catch (err) {
                batchResults.push({ "原始單字/例句": text, "目標語言": targetLang, "對應翻譯": "連線錯誤", "時間": new Date().toLocaleString() });
              }
            }
          }

          const newWs = XLSX.utils.json_to_sheet(batchResults);
          const newWb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(newWb, newWs, "批次翻譯結果");
          XLSX.writeFile(newWb, "Batch_Translation_Result.xlsx");

          document.getElementById('status-label').innerText = '批次匯出完成';
          alert(`成功完成 ${batchResults.length} 筆資料的批次翻譯與 Excel 匯出！`);
          event.target.value = '';
        } catch (error) {
          alert('解析 Excel 失敗： ' + error.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function exportCurrentToExcel() {
      const source = document.getElementById('source-text').value.trim();
      const result = document.getElementById('result').innerText;
      const sourceLang = document.getElementById('source-lang').value;
      const targetLang = document.getElementById('target-lang').value;

      if (!source || result.includes('顯示於此')) {
        alert('目前沒有可匯出的翻譯內容！');
        return;
      }

      const exportData = [{
        "來源語言": sourceLang,
        "原始單字/例句": source,
        "目標語言": targetLang,
        "對應翻譯": result,
        "匯出時間": new Date().toLocaleString()
      }];

      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "單筆翻譯");
      XLSX.writeFile(wb, "Current_Translation.xlsx");
    }

    function exportHistoryToExcel() {
      if (!currentHistoryData || Object.keys(currentHistoryData).length === 0) {
        alert('目前雲端沒有可匯出的歷史紀錄！');
        return;
      }

      const historyArray = Object.values(currentHistoryData).map((item, index) => ({
        "編號": index + 1,
        "語言配對": item.langpair,
        "原始文字": item.source,
        "翻譯結果": item.target,
        "記錄時間": item.timestamp
      }));

      const ws = XLSX.utils.json_to_sheet(historyArray);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "雲端翻譯紀錄");
      XLSX.writeFile(wb, "Firebase_Translation_History.xlsx");
    }

    async function handleAuth(action) {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      const nickname = document.getElementById('nickname-input').value.trim();

      if (!email || !password) {
        alert('請完整填寫電子郵件與密碼！');
        return;
      }
      if (action === 'register' && !nickname) {
        alert('註冊時請輸入您的暱稱！');
        return;
      }
      if (nickname) {
        localStorage.getItem('user_nickname') || localStorage.setItem('user_nickname', nickname);
      }

      try {
        if (action === 'register') {
          await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
          alert('註冊成功並已自動登入！');
        } else {
          await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
        }
      } catch (error) {
        alert('操作失敗： ' + error.message);
      }
    }

    function handleLogout() {
      window.signOut(window.firebaseAuth).then(() => {
        localStorage.removeItem('user_nickname');
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyResult() {
      const text = document.getElementById('result').innerText;
      if (!text || text.includes('顯示於此')) {
        alert('沒有可複製的翻譯結果！');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert('已成功複製到剪貼簿！');
      });
    }
  </script>
