<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多國語言線上翻譯平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #64748b;
      --border: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .translator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .translator-grid {
        grid-template-columns: 1fr;
      }
    }

    .pane {
      display: flex;
      flex-direction: column;
    }

    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    select, button {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      outline: none;
      transition: all 0.2s;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    textarea, .result-box {
      width: 100%;
      height: 160px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
      background: #fff;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .result-box {
      background: #f1f5f9;
      white-space: pre-wrap;
      overflow-y: auto;
      color: var(--text);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .char-count {
      font-size: 12px;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌐 多國語言線上翻譯平台</h2>
    <p class="subtitle">支援繁體中文、英文、日文、越南文等互譯，完全免費且無需設定金鑰。</p>

    <div class="translator-grid">
      <!-- 來源輸入區 -->
      <div class="pane">
        <div class="pane-header">
          <label for="source-lang">來源語言</label>
          <select id="source-lang">
            <option value="autodetect">自動偵測語言</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">英文 (English)</option>
            <option value="ja">日文 (日本語)</option>
            <option value="vi">越南文 (Tiếng Việt)</option>
          </select>
        </div>
        <textarea id="source-text" placeholder="請在此輸入要翻譯的文字..." oninput="updateCharCount()"></textarea>
        <div class="actions">
          <span class="char-count" id="char-count">0 字元</span>
          <button class="btn-secondary" onclick="clearText()">清空</button>
        </div>
      </div>

      <!-- 翻譯結果區 -->
      <div class="pane">
        <div class="pane-header">
          <label for="target-lang">目標語言</label>
          <select id="target-lang">
            <option value="zh-TW">繁體中文</option>
            <option value="en" selected>英文 (English)</option>
            <option value="ja">日文 (日本語)</option>
            <option value="vi">越南文 (Tiếng Việt)</option>
          </select>
        </div>
        <div id="result" class="result-box">等待輸入翻譯內容...</div>
        <div class="actions">
          <span class="char-count" id="status-text">就緒</span>
          <button class="btn-secondary" onclick="copyResult()">複製結果</button>
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 10px;">
      <button class="btn-primary" style="width: 100%; font-size: 16px; padding: 12px;" onclick="translateText()">開始翻譯</button>
    </div>
  </div>

  <script>
    // 建議替換為您自己的常用 Email，可以將 MyMemory API 免費額度從每天 5,000 提升至 50,000 字元
    const USER_EMAIL = "your-email@example.com"; 

    function updateCharCount() {
      const text = document.getElementById('source-text').value;
      document.getElementById('char-count').innerText = `${text.length} 字元`;
    }

    function clearText() {
      document.getElementById('source-text').value = '';
      document.getElementById('result').innerText = '等待輸入翻譯內容...';
      updateCharCount();
    }

    async function translateText() {
      const text = document.getElementById('source-text').value.trim();
      const sourceLang = document.getElementById('source-lang').value;
      const targetLang = document.getElementById('target-lang').value;
      const resultDiv = document.getElementById('result');
      const statusText = document.getElementById('status-text');

      if (!text) {
        alert('請先輸入要翻譯的文字！');
        return;
      }

      resultDiv.innerText = '翻譯中...';
      statusText.innerText = '處理中...';

      // 組合語言對應參數 (例如: zh-TW|en 或 autodetect|ja)
      const langpair = `${sourceLang}|${targetLang}`;

      try {
        let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;
        
        // 若有填入 Email，帶入 de 參數可享有每天 50,000 字元較高額度
        if (USER_EMAIL && USER_EMAIL !== "your-email@example.com") {
          url += `&de=${encodeURIComponent(USER_EMAIL)}`;
        }

        const response = await fetch(url);
        const data = await response.json();

        if (data && data.responseStatus === 200 && data.responseData) {
          resultDiv.innerText = data.responseData.translatedText;
          statusText.innerText = '翻譯完成';
        } else {
          resultDiv.innerText = '翻譯發生異常，請稍後再試。';
          statusText.innerText = '錯誤';
        }
      } catch (error) {
        resultDiv.innerText = '連線錯誤：' + error.message;
        statusText.innerText = '連線失敗';
      }
    }

    function copyResult() {
      const resultText = document.getElementById('result').innerText;
      if (!resultText || resultText === '等待輸入翻譯內容...' || resultText.includes('翻譯中')) {
        alert('沒有可複製的翻譯結果！');
        return;
      }
      navigator.clipboard.writeText(resultText).then(() => {
        alert('已成功複製翻譯結果！');
      }).catch(err => {
        alert('複製失敗：' + err);
      });
    }
  </script>
</body>
</html>
